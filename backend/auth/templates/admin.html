<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Legalsathi Admin</title>
  <style>
    :root {
      --bg-1: #111827;
      /* gray-900 */
      --bg-2: #1f2937;
      /* gray-800 */
      --bg-3: #374151;
      /* gray-700 */
      --text: #e5e7eb;
      /* gray-200 */
      --muted: #9ca3af;
      /* gray-400 */
      --border: #334155;
      /* slate-700 */
      --brand: #f97316;
      /* orange-500 */
      --brand-600: #ea580c;
      /* orange-600 */
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      color: var(--text);
      background: radial-gradient(1000px 600px at -10% -10%, #0b0f1a, transparent),
        radial-gradient(1200px 700px at 110% 10%, #2a0f00, transparent),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: saturate(1.1) blur(6px);
      background: rgba(0, 0, 0, .25);
      border-bottom: 1px solid rgba(148, 163, 184, .25);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px
    }

    .row {
      display: flex;
      gap: 32px
    }

    .sidebar {
      width: 256px
    }

    .btn-tab {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      background: transparent;
      color: #cbd5e1
    }

    .btn-tab.active {
      background: var(--brand);
      color: #fff
    }

    .btn-tab:not(.active):hover {
      background: rgba(55, 65, 81, .5)
    }

    

    .main {
      flex: 1
    }

    h1 {
      margin: 0;
      font-size: 24px
    }

    h2 {
      margin: 8px 0 0;
      font-size: 22px
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: #fff;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 600
    }

    .btn.primary {
      background: var(--brand);
      color: #fff
    }

    .btn.primary:hover {
      background: var(--brand-600)
    }

    .btn.ghost {
      background: var(--bg-3);
      color: #e5e7eb
    }

    .btn.ghost:hover {
      background: #475569
    }

    .card {
      background: rgba(31, 41, 55, .6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px
    }

    .search-wrap {
      position: relative
    }

    .search {
      width: 260px;
      padding: 10px 12px 10px 36px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #374151;
      color: #fff
    }

    .search::placeholder {
      color: #94a3b8
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .7
    }

    .table-wrap {
      overflow: auto
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    thead th {
      color: var(--muted);
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid #475569;
      font-weight: 600
    }

    tbody td {
      padding: 14px 8px;
      border-bottom: 1px solid rgba(71, 85, 105, .5)
    }

    tbody tr:hover {
      background: rgba(55, 65, 81, .3)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600
    }

    .status-processed {
      color: #166534;
      background: #dcfce7
    }

    .status-processing {
      color: #78350f;
      background: #fef3c7
    }

    .status-failed {
      color: #7f1d1d;
      background: #fee2e2
    }

    .type-pill {
      background: #475569;
      color: #e5e7eb;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px
    }

    .actions button {
      background: transparent;
      border: 0;
      color: #cbd5e1;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px
    }

    .actions button:hover {
      background: rgba(148, 163, 184, .15);
      color: #fff
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: #475569;
      overflow: hidden
    }

    .progress>div {
      height: 100%;
      width: 0%;
      background: var(--brand);
      transition: width .25s ease
    }

    .grid {
      display: grid;
      gap: 16px
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px
    }

    .online::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      display: inline-block
    }

    @media (max-width:980px) {
      .row {
        flex-direction: column
      }

      .sidebar {
        width: 100%
      }

      .search {
        width: 100%
      }
    }

    a{
      color: #fff;
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
    }
    a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        a:hover::before {
            left: 100%;
        }
        a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
  </style>
</head>

<body>
  <header>
    <div class="container"
      style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:14px; padding-bottom:14px;">
      <div style="display:flex; align-items:center; gap:12px">
        <div class="brand-badge"><a href="">⚖️</a></div>
        <h1>Legalsathi Admin</h1>
      </div>
      <div style="display:flex; align-items:center; gap:12px">
        <div style="text-align:right">
          <div style="font-size:12px; opacity:.8">Welcome back</div>
          <div style="font-weight:600"></div>
        </div>
        {% if user %}
        <a href="http://127.0.0.1:8000/logout">Logout</a>
        {% else %}
        <a href="http://127.0.0.1:8000/signin">Login</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px; padding-bottom:40px">
    <div class="row">
      <aside class="sidebar">
        <nav class="grid">
          <button class="btn-tab active" data-tab="documents">📄 <span>Documents</span></button>
          <!-- <button class="btn-tab" data-tab="users">👥 <span>Users</span></button> -->
        </nav>
      </aside>

      <section class="main">
        <!-- Documents TAB -->
        <div id="tab-documents" class="tab">
          <div class="toolbar" style="margin-bottom:16px">
            <h2>Document Management</h2>
            <div style="display:flex; align-items:center; gap:8px">
              <button id="btn-upload" class="btn primary">⬆️ Upload Documents</button>
              <input id="file-input" type="file" multiple accept=".pdf,.doc,.docx,.txt" style="display:none" />
            </div>
          </div>

          <div id="upload-panel" class="card" style="display:none; margin-bottom:16px">
            <div class="toolbar" style="margin-bottom:8px">
              <span style="color:#cbd5e1">Uploading documents...</span>
              <span id="upload-pct" style="color:#fdba74">0%</span>
            </div>
            <div class="progress">
              <div id="upload-bar"></div>
            </div>
          </div>

          <div class="card">
            <div class="toolbar" style="margin-bottom:12px">
              <div class="search-wrap">
                <span class="search-icon">🔎</span>
                <input id="search-docs" class="search" type="text" placeholder="Search documents..." />
              </div>
              <button class="btn ghost">🧰 Filter</button>
            </div>
            <div class="table-wrap">
              <table id="docs-table">
                <thead>
                  <tr>
                    <th>Document Name</th>

                    <th>Upload Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Users TAB -->
        <div id="tab-users" class="tab" style="display:none">
          <div class="toolbar" style="margin-bottom:16px">
            <h2>User Management</h2>
          </div>
          <div class="card">
            <div class="toolbar" style="margin-bottom:12px">
              <div class="search-wrap">
                <span class="search-icon">🔎</span>
                <input id="search-users" class="search" type="text" placeholder="Search users..." />
              </div>
              <div style="display:flex; gap:8px">
                <button class="btn ghost" data-filter="all">All Users</button>
                <button class="btn ghost" data-filter="active">Active</button>
                <button class="btn ghost" data-filter="inactive">Inactive</button>
              </div>
            </div>
            <div class="table-wrap">
              <table id="users-table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Join Date</th>


                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

      </section>
    </div>
  </main>
  <script>
    // ---- State ----
    const state = {
      activeTab: 'documents',
      searchDocs: '',
      searchUsers: '',
      userFilter: 'all',
      documents: [],
      users: []
    };

    // ---- Helpers ----
    const el = sel => document.querySelector(sel);
    const elAll = sel => Array.from(document.querySelectorAll(sel));

    function setActiveTab(tab) {
      state.activeTab = tab;
      elAll('.btn-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      el('#tab-documents').style.display = tab === 'documents' ? '' : 'none';
      el('#tab-users').style.display = tab === 'users' ? '' : 'none';
    }

    // ---- Render Documents ----
    function renderDocs() {
      const tbody = el('#docs-table tbody');
      const q = state.searchDocs.toLowerCase();

      const filtered = state.documents.filter(d =>
        d.filename.toLowerCase().includes(q)
      );

      tbody.innerHTML = filtered.map((d, i) => `
      <tr data-id="${i}">
        <td>📄 <span style="font-weight:600">${d.filename}</span></td>
        
        
        <td>${new Date(d.uploaded_at).toLocaleString()}</td>
        <td class="actions">
          <button title="Preview" data-action="view" data-filename="${d.filepath.split(/[/\\]/).pop()}">👁️</button>

          <button title="Delete" data-action="delete">🗑️</button>
        </td>
      </tr>
    `).join('');
    }

    // ---- Render Users (placeholder for now) ----
    function renderUsers() {
      const tbody = el('#users-table tbody');
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;opacity:.7">No users loaded</td></tr>`;
    }

    // ---- Fetch documents from backend ----
    async function loadDocuments() {
      try {
        const res = await fetch("http://127.0.0.1:8000/documents");
        const data = await res.json();
        state.documents = data;
        renderDocs();
      } catch (err) {
        console.error("Error loading documents:", err);
      }
    }

    // ---- PDF Preview ----
    function openPreview(filepath) {
      const modal = document.createElement('div');
      modal.id = "pdf-modal";
      modal.style.position = "fixed";
      modal.style.top = "0";
      modal.style.left = "0";
      modal.style.width = "100%";
      modal.style.height = "100%";
      modal.style.background = "rgba(0,0,0,0.8)";
      modal.style.display = "flex";
      modal.style.flexDirection = "column";
      modal.style.zIndex = "1000";

      modal.innerHTML = `
      <div style="padding:8px; text-align:right; background:#1f2937; color:#fff">
        <button id="close-preview" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Close ✖</button>
      </div>
      <iframe src="http://127.0.0.1:8000/uploaded_pdfs/${filepath}" style="flex:1; border:none; width:100%"></iframe>
    `;

      document.body.appendChild(modal);
      el('#close-preview').addEventListener('click', () => modal.remove());
    }

    // ---- Event wiring ----
    elAll('.btn-tab').forEach(btn => btn.addEventListener('click', () => setActiveTab(btn.dataset.tab)));
    el('#search-docs').addEventListener('input', e => { state.searchDocs = e.target.value; renderDocs(); });

    // Table actions
    document.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.action === 'view') {
        openPreview(btn.dataset.filename);
      }
      if (btn.dataset.action === 'delete') {
        const tr = btn.closest('tr');
        const id = Number(tr?.dataset.id);
        const doc = state.documents[id];
        if (confirm(`Delete document: ${doc.filename}?`)) {
          state.documents = state.documents.filter((_, i) => i !== id);
          renderDocs();
        }
      }
    });

    // --- Upload Handler ---
el('#btn-upload').addEventListener('click', () => {
  el('#file-input').click();
});

el('#file-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  for (let file of files) {
    await uploadFile(file);
  }

  // Reload documents after upload
  await loadDocuments();
  e.target.value = ""; // reset input
});

// --- Upload single file ---
async function uploadFile(file) {
  const url = `http://127.0.0.1:8000/upload-pdf/`;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(url, {
      method: "POST",
      body: formData,
      // If your backend requires auth:
      // headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
    });

    if (!res.ok) throw new Error("Upload failed");

    console.log(`Uploaded: ${file.name}`);
  } catch (err) {
    console.error("Error uploading file:", err);
  }
}

// --- Delete document ---
async function deleteDocument(doc) {
  try {
    const res = await fetch(`http://127.0.0.1:8000/documents/${doc.id}`, {
      method: "DELETE",
      // headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
    });

    if (!res.ok) throw new Error("Delete failed");

    console.log(`Deleted: ${doc.filename}`);
    state.documents = state.documents.filter(d => d.id !== doc.id);
    renderDocs();
  } catch (err) {
    console.error("Error deleting document:", err);
  }
}

// --- Table actions ---
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.action === 'view') {
    openPreview(btn.dataset.filename);
  }
  if (btn.dataset.action === 'delete') {
    const tr = btn.closest('tr');
    const id = Number(tr?.dataset.id);
    const doc = state.documents[id];
    if (confirm(`Delete document: ${doc.filename}?`)) {
      deleteDocument(doc);
    }
  }
});

    // ---- Init ----
    loadDocuments();
    renderUsers();
  </script>




</body>

</html>
